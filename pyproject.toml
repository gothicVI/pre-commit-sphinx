[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pre_commit_sphinx"
version = "0.2.0"
authors = [
  { name="Tom Clark (thclark)" },
  { name="Sebastian Steinbeißer", email="Sebastian.Steinbeisser@lrz.de" },
  { name="Alexander Zeller", email="Alexander.Zeller@lrz.de" },
]
description = "Pre-commit hooks to check that sphinx docs build correctly."
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.14"

[project.scripts]
build-docs = "pre_commit_sphinx.build_docs:main"

[tool.autopep8]
max_line_length = 120
in-place = true
recursive = true
aggressive = 3

[tool.black]
line-length = 120
target-version = ['py314']

[tool.pylint]
disable = [
  "C0302", # too many lines
  "C0325", # superfluous-parens
  "R0801", # duplicate-code
  "R0912", # too-many-branches
  "R0913", # too-many-arguments
  "R0914", # too-many-locals
  "R0915", # too-many-statements
]
max-line-length = 120
ignore = [".git", "__pycache__"]
j = 0
reports = true

[tool.isort]
line_length = 120
profile = "black"
force_grid_wrap = 2
multi_line_output = 3

[tool.mypy]
exclude = "(.git|__pycache__)"

[tool.pydocstyle]
convention = "numpy"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", "C901",
  "D203", "D212", "D413",
  "ERA001",
  "FBT001", "FBT002",
  "PLR0912", "PLR0913", "PLR0915", "PLR2004",
  "PTH123",
  "S108", "S501",
]

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "bandit>=1.9.4",
    "black>=26.10.1",
    "codespell>=2.4.3",
    "flake8>=7.5.0",
    "flake8-bugbear>=26.10.27",
    "furo>=2025.12.19",
    "isort>=9.0.2",
    "mypy>=2.4.1",
    "pep8-naming>=0.15.1",
    "pre-commit>=4.7.0",
    "pre-commit-update>=0.10.0",
    "pycodestyle>=2.15.0",
    "pydocstyle>=6.3.0",
    "pyflakes>=4.1.0",
    "pylint>=4.1.3",
    "pyright>=1.1.414",
    "pyupgrade>=3.22.0",
    "rstcheck>=6.3.0",
    "ruff>=0.17.3",
]
